[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cutline-backend"
version = "0.1.0"
description = "Multimodal multi-agent weekend trailer renderer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=0.2,<2",
  "google-genai>=1.0,<2",
  "opencv-python-headless>=4.10,<5",
  "imagehash>=4.3,<5",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "rembg>=2.0.60,<3",
  "onnxruntime>=1.20,<2",
  "edge-tts>=7,<8",
  "ffmpeg-python>=0.2,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
